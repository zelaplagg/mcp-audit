[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-audit"
dynamic = ["version"]
description = "Security audit and LLM evals for MCP servers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anastasiia Zelenska" }]
keywords = ["mcp", "model-context-protocol", "security", "tool-poisoning", "prompt-injection", "sarif"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.scripts]
mcp-audit = "mcp_audit.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mcp_audit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
