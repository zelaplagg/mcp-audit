name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Smoke test the installed CLI
        run: |
          mcp-audit rules
          mcp-audit scan --from-json examples/poisoned-tools.json --fail-on none --format sarif -o /tmp/audit.sarif
          test -s /tmp/audit.sarif
          mcp-audit eval --dry-run --from-json examples/travel-mcp-tools.json --cases examples/eval-travel-mcp.json
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | mcp-audit serve | grep -q scan_tools
